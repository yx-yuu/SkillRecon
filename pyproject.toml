[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "skillrecon"
version = "0.2.0"
description = "Clause-scoped documentation and behavior reconciliation for agent skills"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.12,<3",
  "markdown-it-py>=3,<4",
  "PyYAML>=6,<7",
  "httpx>=0.28,<1",
  "openai>=1.68,<3",
  "requests>=2.32,<3",
  "networkx>=3.4,<4",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "tree-sitter==0.25.2",
  "tree-sitter-bash==0.25.1",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-typescript==0.23.2",
]

[project.scripts]
skillrecon = "skillrecon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
