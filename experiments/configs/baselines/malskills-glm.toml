# Native MalSkills 0.1.0 configuration. Credentials are environment-only.
# Set MALSKILLS_LLM_BASE_URL and MALSKILLS_LLM_API_KEY.
[llm]
mode = "api"
model = "glm-5.1"
timeout_sec = 300

[llm.sso_extraction]
enabled = true

[llm.object_analysis]
enabled = true

[llm.pattern_reasoning]
enabled = true

[llm.rule_feedback]
enabled = false
